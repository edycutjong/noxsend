    </radialGradient>
    <radialGradient id="auroraT" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#14b8a6" stop-opacity="0.6"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/></radialGradient>
