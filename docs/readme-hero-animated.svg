      <stop offset="0" stop-color="#0a0016"/><stop offset="0.5" stop-color="#0b1220"/><stop offset="1" stop-color="#03110f"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5eead4"/><stop offset="0.45" stop-color="#14b8a6"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
