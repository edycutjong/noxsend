<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="NoxSend — a padlock with a paper plane on its face, synthwave">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0016"/>
      <stop offset="0.55" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#03110f"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="planeTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="planeBot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="shackle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e2a2b"/>
      <stop offset="1" stop-color="#08181c"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="badge"><rect x="24" y="24" width="464" height="464" rx="112"/></clipPath>
  </defs>

  <!-- badge -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg)"/>
  <g clip-path="url(#badge)">
    <!-- retro sun -->
    <circle cx="256" cy="248" r="150" fill="url(#sun)" opacity="0.42"/>
    <g fill="#03110f" opacity="0.9">
      <rect x="106" y="250" width="300" height="8"/>
      <rect x="106" y="270" width="300" height="10"/>
      <rect x="106" y="294" width="300" height="12"/>
    </g>
    <!-- perspective grid floor -->
    <g stroke="#7c3aed" stroke-width="2" opacity="0.4">
      <line x1="256" y1="330" x2="-140" y2="500"/>
      <line x1="256" y1="330" x2="90" y2="500"/>
      <line x1="256" y1="330" x2="256" y2="500"/>
      <line x1="256" y1="330" x2="422" y2="500"/>
      <line x1="256" y1="330" x2="652" y2="500"/>
      <line x1="40" y1="360" x2="472" y2="360"/>
      <line x1="8" y1="392" x2="504" y2="392"/>
      <line x1="-20" y1="432" x2="532" y2="432"/>
      <line x1="-48" y1="480" x2="560" y2="480"/>
    </g>
    <!-- horizon neon strip -->
    <rect x="24" y="327" width="464" height="4" fill="url(#edge)" opacity="0.95" filter="url(#glow)"/>
    <!-- stars -->
    <g fill="#e2f7f5">
      <circle cx="96" cy="96" r="2.2" opacity="0.8"/>
      <circle cx="150" cy="150" r="1.6" opacity="0.6"/>
      <circle cx="392" cy="110" r="2" opacity="0.75"/>
      <circle cx="430" cy="176" r="1.5" opacity="0.5"/>
      <circle cx="330" cy="80" r="1.5" opacity="0.6"/>
      <circle cx="196" cy="72" r="1.4" opacity="0.5"/>
    </g>
  </g>

  <!-- padlock emblem -->
  <g filter="url(#glow)" transform="translate(256,316) scale(1.08) translate(-256,-316)">
    <!-- shackle -->
    <path d="M212 262 L212 206 A44 44 0 0 1 300 206 L300 262" fill="none" stroke="url(#shackle)" stroke-width="22" stroke-linecap="round"/>
    <!-- body -->
    <rect x="158" y="256" width="196" height="150" rx="30" fill="url(#body)" stroke="url(#edge)" stroke-width="3.5"/>
    <!-- paper plane on the face (folded from the lock) -->
    <g transform="translate(256,330) rotate(-18) scale(7.7) translate(-12,-12)">
      <path d="M2 3 L23 12 L17 12 L2 10 Z" fill="url(#planeTop)"/>
      <path d="M2 21 L23 12 L17 12 L2 14 Z" fill="url(#planeBot)"/>
      <path d="M17 12 L2 3 M17 12 L2 21" stroke="#03110f" stroke-width="0.7" opacity="0.5" fill="none"/>
    </g>
    <!-- launch tracer -->
    <circle cx="368" cy="300" r="4.5" fill="#5eead4"/>
    <path d="M330 314 Q352 306 366 300" stroke="#5eead4" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
